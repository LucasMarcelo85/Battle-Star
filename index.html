<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="shortcut icon" href="./img/icone__1_-removebg-preview.png" type="image/x-icon">
    <title>Galácticos</title>

</head>

<body>
    <div id="rotate-device" role="status" aria-live="polite">
        <div class="rotate-device-content">
            <span class="rotate-device-icon" aria-hidden="true">↻</span>
            <p>Vire o dispositivo para jogar na horizontal</p>
        </div>
    </div>

    <video id="intro-video" autoplay muted playsinline webkit-playsinline preload="auto"
        src="img/video inicial.mp4"></video>

    <div id="app" style="display: none;">
        <div id="logo">

            <img src="./img/banner-removebg-preview.png" alt="logo">
        </div>
        <div id="container" class="absolute">
            <div id="start" class="column absolute">
                <button id="start-btn" class="btn">Jogar</button>
            </div>
            <div id="play" class="absolute">
                <canvas id="canvas" class="absolute"></canvas>
                <div class="content absolute">
                    <div class="header">
                        <ul class="info">
                            <li>
                                <img src="./img/time3.png" alt="time">
                                <span id="time">00</span>
                            </li>
                            <li>
                                <img src="./img/fuel2.png" alt="fuel">
                                <span id="fuel">00</span>
                            </li>
                            <li>
                                <img src="./img/score.png" alt="score">
                                <span id="score">00</span>
                            </li>
                            <li>
                                <img src="./img/playerBullet.png" alt="score">
                                <span id="shoot">00</span>
                            </li>

                        </ul>
                        <ul class="option">
                            <li id="game-font-size-add">
                                <img class="pause" src="./img/a+.png" alt="time">
                            </li>
                            <li id="game-font-size-reduce">
                                <img class="pause" src="./img/a-.png" alt="time">
                            </li>
                            <li id="game-mute-btn">
                                <img class="pause" src="./img/mute.png" alt="time">
                                <img class="pause" src="./img/speaker.png" alt="time">
                            </li>
                            <li id="game-pause-btn">
                                <img class="pause" src="./img/play.png" alt="time">
                                <img class="pause" src="./img/pause.png" alt="time">
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div id="over" class="column absolute">
                <div class="game-data">
                    <p class="message">
                        <span>
                            <img src="./img/time3.png" alt="time" class="over-icon">
                        </span>
                        <span>
                            --
                        </span>
                        <span class="time">00</span>
                    </p>
                    <p class="message">
                        <span>
                            <img src="./img/iconalienmorto.png" alt="aliens killed" class="over-icon">
                        </span>
                        <span>
                            --
                        </span>
                        <span class="aliens-killed">00</span>
                    </p>
                    <p class="message">
                        <span>
                            <img src="./img/iconaliadomorto.png" alt="allies killed" class="over-icon">
                        </span>
                        <span>
                            --
                        </span>
                        <span class="allies-killed">00</span>
                    </p>
                </div>
                <input type="text" id="name" placeholder="Digite seu nome" />
                <button id="submit-btn" class="btn" disabled>
                    continuar o jogo
                </button>
            </div>
            <div id="rank" class="column absolute">
                <table class="scroll">
                    <thead>
                        <tr>
                            <th>Classificação</th>
                            <th>Nome</th>
                            <th>Tempo</th>
                            <th>Aliens abatido</th>
                            <th>Aliados mortos</th>
                            <th>Eficiencia</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
                <button id="restart-btn" class="btn">
                    Reiniciar
                </button>
            </div>
        </div>
    </div>
    <footer>
        <span>Desenvolvedor
            <a href="https://github.com/LucasMarcelo85" target="_blank"> @DevMarcelo</a>
        </span>
    </footer>
    <script src="js/config/config.js"></script>
    <script src="js/utils/utils.js"></script>
    <script src="js/utils/res.js"></script>
    <script src="js/class/scene.js"></script>
    <script src="js/class/cooldown.js"></script>
    <script src="js/class/element.js"></script>
    <script src="js/class/animation.js"></script>
    <script src="js/class/plane.js"></script>
    <script src="js/class/bullet.js"></script>
    <script src="js/class/player.js"></script>
    <script src="js/mobile-controls.js"></script>
    <script src="js/class/enemy.js"></script>
    <script src="js/class/meteorite.js"></script>
    <script src="js/class/friend.js"></script>
    <script src="js/class/star.js"></script>
    <script src="js/class/fuel.js"></script>
    <script src="js/scenes/start.js"></script>
    <script src="js/scenes/play.js"></script>
    <script src="js/scenes/over.js"></script>
    <script src="js/scenes/rank.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
    <script src="js/responsive.js"></script>

</body>

</html>
